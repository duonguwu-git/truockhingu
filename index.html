            position: relative;
        }
        .container {

        h1, h2 { color: #c0392b; /* Đỏ đô */ }
        button {
            background: #ffd700; /* Vàng kim */

            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin: 20px 0;
            will-change: transform, box-shadow;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 5px 10px rgba(255, 215, 0, 0.5); }
        input[type="date"] {
            padding: 10px;
            font-size: 18px;
            border: 2px solid #c0392b;
            border-radius: 10px;
            margin: 20px 0;
            transition: border-color 0.3s ease-in-out;
        }
        input[type="date"]:focus { border-color: #ffd700; }
        /* Ẩn các màn với transition */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .active {
            display: block;
            opacity: 1;
        }
        /* Ống quẻ - lắc mạnh */
        #jar {
            width: 180px;
            height: 240px;
            background: url('jar.png') center/contain no-repeat;
            margin: 40px auto;
            transition: transform 0.1s ease-in-out;
            will-change: transform;
        }
        .shaking { 
            animation: shake-strong 0.15s infinite cubic-bezier(0.36, 0.07, 0.19, 0.97); 
        }
        @keyframes shake-strong {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-5px, -8px) rotate(-5deg); }
            20% { transform: translate(8px, -3px) rotate(6deg); }
            30% { transform: translate(-6px, 7px) rotate(-4deg); }
            40% { transform: translate(7px, -6px) rotate(5deg); }
            50% { transform: translate(-10px, 0) rotate(-8deg); }
            60% { transform: translate(10px, 5px) rotate(8deg); }
            70% { transform: translate(-8px, -5px) rotate(-6deg); }
            80% { transform: translate(6px, 8px) rotate(6deg); }
            90% { transform: translate(-7px, -7px) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        /* Que quẻ */
        .sticks-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 200px;
            margin: 40px 0;
            position: relative;
        }
        .stick {
            width: 20px;
            height: 150px;
            background-color: #5d4037;
            margin: 0 10px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), box-shadow 0.3s ease-in-out;
            position: relative;
            border-radius: 5px 5px 0 0;
            box-shadow: 0 0 10px rgba(93, 64, 55, 0.5);
            will-change: transform, box-shadow;
        }
        .stick:hover { box-shadow: 0 0 20px #ffd700; }
        .stick.selected { transform: translateY(-100px); }
        .stick-content {
            position: absolute;
            bottom: -50px;
            width: 100%;
            text-align: center;
            color: #fff5e6;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, bottom 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .stick.selected .stick-content { opacity: 1; bottom: -150px; }
        .stick.disabled { pointer-events: none; opacity: 0.5; }
        /* Modal kết quả */
        #result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        #result-content {

        #result-modal.visible #result-content { transform: scale(1); }

            margin-bottom: 20px;

            opacity: 0.6;

        /* Confetti canvas */
        #confetti-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1000; }

        const vipFortune = '💎 THIẾU GIA VIP 10/5! Quà đặc biệt chờ bạn tại quầy!';

        function getRandomFortune(birthdate) {
            if (birthdate === '2010-06-25') {
                return { result: vipFortune, type: 'vip', zodiac: 'VIP Đặc Biệt' };
            }
            const zodiac = getZodiacSign(birthdate);
            if (zodiac === 'Không xác định') {
                return { result: 'Ngày sinh lạ quá, thử lại đi bro!', type: 'normal', zodiac: '???' };
            }
            const array = zodiacFortunes[zodiac] || [];
            const index = Math.floor(Math.random() * array.length);
            let result = array[index];
            const type = result.includes('xui') || result.includes('giải nghiệp') ? 'bad' : result.includes('ổn') ? 'normal' : 'good';
            if (Math.random() < 0.1 && type !== 'bad') {
                result += ' Nhận móc khóa quà từ 10/5!';
            }
            return { result, type, zodiac };
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showAllScreens(show) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = show ? 'block' : 'none');
        }

        function confetti(isVip = false) {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const particles = [];
            const numParticles = isVip ? 300 : 100;
            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 4 + 1,
                    d: Math.random() * numParticles / 100,
                    color: `hsl(${Math.random()*360}, 100%, 50%)`,
                    tilt: Math.random() * 10 - 10,
                    tiltAngleIncremental: (Math.random() * 0.07) + .05,
                    tiltAngle: 0
                });
            }
            let animationFrame;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.tilt = Math.sin(p.tiltAngle) * 15;
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + (p.r / 4), p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 4));
                    ctx.stroke();
                    if (p.y > canvas.height + 20) particles.splice(index, 1);
                });
                if (particles.length > 0) animationFrame = requestAnimationFrame(draw);
            }
            draw();
        }

        function showResult(fortune) {
            document.getElementById('zodiac-name').innerText = fortune.zodiac || 'bạn';
            document.getElementById('result-text').innerText = fortune.result;
            const modal = document.getElementById('result-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('visible'), 10);
            vibrate(fortune.type === 'vip' ? [100, 50, 100, 50, 100] : [50]);
            playAudio(audioTaDa);
            if (fortune.type === 'vip') {
                playAudio(audioVip);
                confetti(true);
            } else if (fortune.type === 'good' || fortune.type === 'normal') {
                playAudio(audioWin);
                if (fortune.type === 'good') confetti(false);
            } else if (fortune.type === 'bad') {
                playAudio(audioSad);
            }
            showAllScreens(false);
        }

            vibrate([100, 50, 100, 50, 100, 50, 100, 50, 100]);
            setTimeout(() => {
                document.getElementById('jar').classList.remove('shaking');
                audioShake.pause();
                audioShake.currentTime = 0;
                showScreen('screen-sticks');
                const container = document.querySelector('.sticks-container');
                container.innerHTML = '';
                let selected = false;
                for (let i = 0; i < 6; i++) {
                    const stick = document.createElement('div');
                    stick.classList.add('stick');
                    stick.innerHTML = `<div class="stick-content">Quẻ bí mật!</div>`;
                    stick.style.transform = `rotate(${ (i - 2.5) * 5 }deg)`;
                    stick.style.opacity = 0;
                    container.appendChild(stick);
                    setTimeout(() => stick.style.opacity = 1, i * 100);
                    stick.addEventListener('click', () => {
                        if (selected) return;
                        selected = true;
                        playAudio(audioClick);
                        vibrate(50);
                        stick.classList.add('selected');
                        document.querySelectorAll('.stick:not(.selected)').forEach(s => s.classList.add('disabled'));

                            playAudio(audioFlip);
                            const fortune = getRandomFortune(birthdate);
                            localStorage.setItem(storageKey, JSON.stringify(fortune));
                            showResult(fortune);
                        }, 600);
                    });
                }
            }, 2500);
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            const modal = document.getElementById('result-modal');
            modal.classList.remove('visible');
            setTimeout(() => modal.style.display = 'none', 500);

        window.addEventListener('resize', () => {

            canvas.height = window.innerHeight;

        document.addEventListener('touchstart', unlockAllAudios, { once: true });
