<title>🔮 Xóc Quẻ Định Mệnh — Gen Z</title>

<style>
:root{
  --do:#c0392b;
  --vang:#ffd700;
  --giay:#fff5e6;
  --go:#5d4037;
  --text:#2c2c2c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  background:linear-gradient(180deg,#2e1b18 0%, #1a0c0c 100%);
  display:flex;align-items:center;justify-content:center;
  color:var(--text);
}
.app{
  width:100%;
  max-width:420px;
  background:var(--giay);
  border-radius:14px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  min-height:90vh;
  margin:12px;
}
.header{
  display:flex;align-items:center;gap:12px;
}
.logo{
  background:linear-gradient(180deg,var(--do),#8b1f1f);
  color:white;width:62px;height:62px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,0.25)
}
h1{margin:0;font-size:20px;color:var(--go)}
.lead{color:#5d4037;margin-top:6px;font-size:13px}

/* Steps */
.step{margin-top:18px}
.btn{
  width:100%;padding:12px 14px;border-radius:12px;border:none;
  background:var(--do);color:white;font-size:16px;margin-top:10px;
  box-shadow:0 6px 12px rgba(192,57,43,0.2);
}
.btn:active{transform:scale(0.985)}
.small{font-size:13px;color:#4b3a36}

/* Jar */
.center{display:flex;flex-direction:column;align-items:center}
.jar{font-size:84px;margin:18px 0;transform-origin:center}
.shake{animation:shake 0.12s linear infinite}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(6deg)}50%{transform:rotate(0)}75%{transform:rotate(-6deg)}100%{transform:rotate(0)}}

/* Cards fan */
.cards{height:180px;position:relative;margin-top:8px}
.card{
  width:86px;height:150px;border-radius:10px;background:linear-gradient(#fff,#f4ead0);
  border:3px solid var(--go);position:absolute;left:50%;bottom:0;transform-origin:bottom center;
  box-shadow:0 6px 20px rgba(93,64,55,0.25);
  display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--go);
  user-select:none;touch-action:none;
}
.card.hide{opacity:0;pointer-events:none;transform:scale(0.95)}
.card:nth-child(1){transform:translateX(-138px) rotate(-25deg)}
.card:nth-child(2){transform:translateX(-90px) rotate(-15deg)}
.card:nth-child(3){transform:translateX(-38px) rotate(-6deg)}
.card:nth-child(4){transform:translateX(8px) rotate(6deg)}
.card:nth-child(5){transform:translateX(58px) rotate(15deg)}
.card:nth-child(6){transform:translateX(110px) rotate(25deg)}

/* Result */
.result{
  margin-top:18px;padding:14px;border-radius:12px;background:white;border:2px dashed var(--do);
  min-height:60px;display:flex;flex-direction:column;justify-content:center;
}
.result.vip{
  background:linear-gradient(45deg,#fff8e1,#fffde7);
  border:2px solid #ffd54f;
  box-shadow:0 8px 30px rgba(255,213,79,0.15);
}
.gift{margin-top:10px;color:var(--do);font-weight:700}

/* small screens */
@media(max-width:420px){
  .jar{font-size:72px}
  .card{width:74px;height:130px}
  .card:nth-child(1){transform:translateX(-120px) rotate(-25deg)}
  .card:nth-child(6){transform:translateX(92px) rotate(25deg)}
}

/* Confetti canvas */
canvas{position:fixed;left:0;top:0;pointer-events:none;z-index:9999}
.note{font-size:12px;color:#5d4037;margin-top:8px}
</style>
</head>

<div class="app" role="main">
  <div class="header">
    <div class="logo">🏺</div>

    </div>
  </div>

  <!-- STEP 1 -->
  <div id="step1" class="step">
    <p class="small">Bạn có tin vào định mệnh?</p>
    <button class="btn" onclick="nextStep(1)">Tôi tin</button>
    <div class="note">Bấm là mở khóa âm thanh & rung trên điện thoại</div>
  </div>

    <p class="small">Mỗi người chỉ bốc một lần, sẵn sàng chưa?</p>

</div>

/* ---------- State ---------- */
let audioUnlocked = false;
const STORAGE_KEY = "xocque_result_v1";

/* ---------- Helpers: audio & vibration ---------- */
function $(id){return document.getElementById(id)}
function tryVibrate(pattern){
  if(navigator.vibrate) navigator.vibrate(pattern);
}

function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  // prime all audio elements
  const audios = document.querySelectorAll("audio");
  audios.forEach(a=>{
    try{
      a.volume = 0.9;
      a.currentTime = 0;
      const p = a.play();
      if(p && p.then) p.then(()=>a.pause()).catch(()=>{ a.pause(); });
      else a.pause();
    }catch(e){/* ignore */}
  });
}

/* Safe play wrapper */
function play(id){
  try{
    const a = $(id);
    if(!a) return;
    a.currentTime = 0;
    const p = a.play();
    if(p && p.catch) p.catch(()=>{ /* ignore play reject */ });
  }catch(e){}
}

/* ---------- UI flow ---------- */
function show(el){ if(typeof el==="string") el=$(el); el.style.display="block"; }
function hide(el){ if(typeof el==="string") el=$(el); el.style.display="none"; }

function nextStep(n){
  unlockAudio(); // MUST call early to open audio on first click
  play("click");
  tryVibrate(40);
  hide("step"+n);
  show("step"+(n+1));
}

function init(){
  // if result exists -> show immediately
  const existing = localStorage.getItem(STORAGE_KEY);
  if(existing){
    const obj = JSON.parse(existing);
    renderResult(obj, true);
    // hide initial steps
    hide("step1"); hide("step2"); hide("step3"); hide("cardsArea");
    return;
  }
  // else show step1
  show("step1");
}
init();

/* ---------- Shake -> show cards ---------- */
function startShake(){
  unlockAudio();
  const dob = $("dob").value;
  if(!dob){ alert("Vui lòng nhập ngày sinh (YYYY-MM-DD)"); return; }
  // save dob in memory for special VIP
  window._dob = dob;
  play("click");
  hide("step3");
  show("shakeArea");
  const jar = $("jar");
  jar.classList.add("shake");
  play("shakeSound");
  tryVibrate([60,40,60]); // pattern
  // 2.5s shake
  setTimeout(()=>{
    jar.classList.remove("shake");
    const s = $("shakeSound"); if(s){ s.pause(); s.currentTime=0; }
    hide("shakeArea");
    show("cardsArea");
  },2500);
}

/* ---------- Pick card ---------- */
function pickCard(index){
  unlockAudio();
  play("swipe");
  tryVibrate(80);
  // hide cards
  hide("cardsArea");
  // decide result
  const dob = window._dob || "";
  let resultObj=null;
  if(dob==="2010-06-25"){
    resultObj = {text:"💎 THIẾU GIA VIP 10/5", type:"vip", gift:true};
  }else{
    // pick random unique fortune among fortunes array
    const r = Math.floor(Math.random()*fortunes.length);
    const text = fortunes[r];
    const isBad = text.includes("Mua nước tại quầy 10/5 để giải nghiệp");
    const gift = text.includes("được tặng") || text.includes("quà") || text.includes("móc khóa") || text.includes("được tặng");
    resultObj = {text, type: isBad ? "bad" : "good", gift: !!gift};
  }
  // store locked result
  localStorage.setItem(STORAGE_KEY, JSON.stringify(resultObj));
  renderResult(resultObj, false);
}

/* ---------- Render result ---------- */
function renderResult(res, loaded){
  const area = $("resultArea");
  area.innerHTML = "";
  const box = document.createElement("div");
  box.className = "result" + (res.type==="vip" ? " vip" : "");
  box.innerHTML = `<div style="font-size:16px;line-height:1.4">${res.text}</div>`;
  area.appendChild(box);

  if(res.gift){
    const g = document.createElement("div");
    g.className = "gift";
    g.textContent = "Hãy mang màn hình này đến gặp nhân viên quầy 10/5 để nhận quà!";
    area.appendChild(g);
  }

  show("resultArea");

  if(!loaded){
    if(res.type==="good" || res.type==="vip"){
      play("win");
      confettiBurst();
      tryVibrate([30,40,30,40,30]);
    } else {
      play("sad");
      tryVibrate([120]);
    }
  }
}

/* ---------- Confetti simple ---------- */
function confettiBurst(){
  const canvas = $("confetti");
  const ctx = canvas.getContext("2d");
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  const pieces = [];
  const colors = ["#c0392b","#ffd700","#5d4037","#fff5e6"];
  for(let i=0;i<120;i++){
    pieces.push({
      x: Math.random()*canvas.width,
      y: Math.random()*-canvas.height,
      r: Math.random()*8+4,
      dx: (Math.random()-0.5)*4,
      dy: Math.random()*4+2,
      color: colors[Math.floor(Math.random()*colors.length)]
    });
  }
  let t=0;
  const anim = ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(p.x,p.y,p.r,p.r*0.6,0,0,Math.PI*2);
      ctx.fill();
      p.x += p.dx;
      p.y += p.dy;
      p.dy += 0.05;
      if(p.y>canvas.height+20){ p.y = -20; p.x = Math.random()*canvas.width; p.dy = Math.random()*4+2; }
    });
    if(t++<200) requestAnimationFrame(anim);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  };
  anim();
}

window._resetXocQue = function(){
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
};
