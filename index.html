<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bói Quẻ 10/5 - Hội Trại Siêu Chill</title>
    <style>
        /* Reset và base styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff5e6; /* Giấy cũ */
            color: #5d4037; /* Gỗ đậm */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            font-size: 18px;
            line-height: 1.5;
        }
        .container {
            max-width: 100%;
            width: 100%;
            background: rgba(255, 245, 230, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(93, 64, 55, 0.2);
        }
        h1, h2 { color: #c0392b; /* Đỏ đô */ }
        button {
            background: #ffd700; /* Vàng kim */
            color: #5d4037;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            margin: 20px 0;
            will-change: transform, box-shadow;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 5px 10px rgba(255, 215, 0, 0.5); }
        input[type="date"] {
            padding: 10px;
            font-size: 18px;
            border: 2px solid #c0392b;
            border-radius: 10px;
            margin: 20px 0;
        }
        /* Ẩn các màn */
        .screen { display: none; }
        .active { display: block; }
        /* Ống quẻ */
        #jar {
            width: 150px;
            height: 200px;
            background: url('jar.png') center/contain no-repeat; /* Giả định file jar.png */
            margin: 40px auto;
            transition: transform 0.1s ease-in-out;
            will-change: transform;
        }
        .shaking { animation: shake 0.3s infinite ease-in-out; }
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-2px, -1px) rotate(-2deg); }
            20% { transform: translate(2px, 1px) rotate(2deg); }
            30% { transform: translate(-1px, 2px) rotate(-1deg); }
            40% { transform: translate(1px, -2px) rotate(1deg); }
            50% { transform: translate(-3px, 0) rotate(-3deg); }
            60% { transform: translate(3px, 1px) rotate(3deg); }
            70% { transform: translate(-2px, -1px) rotate(-2deg); }
            80% { transform: translate(2px, 2px) rotate(2deg); }
            90% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        /* Thẻ quẻ xòe quạt */
        .cards-container {
            display: flex;
            justify-content: center;
            perspective: 1200px;
            margin: 40px 0;
        }
        .card {
            width: 100px;
            height: 150px;
            background: #ffd700; /* Mặt sau */
            margin: 0 10px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), box-shadow 0.3s ease-in-out;
            transform-style: preserve-3d;
            position: relative;
            will-change: transform, box-shadow;
        }
        .card:hover { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); transform: scale(1.05); }
        .card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            transition: opacity 0.3s ease-in-out;
        }
        .card-front { background: url('card-back.png') center/cover; /* Mặt sau thẻ */ }
        .card-back {
            background: #fff5e6;
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-size: 14px;
            color: #c0392b;
            opacity: 0;
        }
        .card.flipped .card-back { opacity: 1; }
        /* Modal kết quả */
        #result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        #result-modal.visible { opacity: 1; }
        #result-content {
            background: #fff5e6;
            padding: 30px;
            border-radius: 20px;
            max-width: 90%;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.5s ease-in-out;
            will-change: transform;
        }
        #result-modal.visible #result-content { transform: scale(1); }
        /* Confetti canvas */
        #confetti-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1000; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Màn 1: Xác nhận quét mã -->
        <div id="screen1" class="screen active">
            <h1>Bói Quẻ Siêu Chill 10/5</h1>
            <p>Bạn đã quét mã coi bói của 10/5?</p>
            <button id="confirm1">ĐỒNG Ý</button>
        </div>

        <!-- Màn 2: Xác nhận sẵn sàng -->
        <div id="screen2" class="screen">
            <p>Bạn sẵn sàng để biết 2026 của bạn chưa?</p>
            <button id="confirm2">ĐỒNG Ý</button>
        </div>

        <!-- Màn nhập ngày sinh -->
        <div id="screen-birthdate" class="screen">
            <p>Nhập ngày sinh của bạn để gieo quẻ nha!</p>
            <input type="date" id="birthdate">
            <button id="cast">Gieo Quẻ</button>
        </div>

        <!-- Màn lắc ống quẻ -->
        <div id="screen-jar" class="screen">
            <p>Đang gieo quẻ...</p>
            <div id="jar"></div>
        </div>

        <!-- Màn chọn thẻ -->
        <div id="screen-cards" class="screen">
            <p>Chọn một thẻ đi, vận mệnh đang chờ!</p>
            <div class="cards-container"></div>
        </div>

        <!-- Modal kết quả -->
        <div id="result-modal">
            <div id="result-content">
                <h2>Kết Quả Quẻ Của Bạn</h2>
                <p id="result-text"></p>
                <button id="close-modal">OK, Đã Rõ!</button>
            </div>
        </div>
    </div>

    <canvas id="confetti-canvas" width="300" height="300"></canvas>

    <script>
        // Âm thanh (tải trực tiếp từ URL HTTPS, royalty-free từ các nguồn mở)
        const audioClick = new Audio('https://orangefreesounds.com/wp-content/uploads/2023/03/Mechanical-button-click-sound-effect.mp3');
        const audioShake = new Audio('https://www.myinstants.com/media/sounds/skeleton-rattling.mp3');
        audioShake.loop = true;
        const audioFlip = new Audio('https://www.orangefreesounds.com/wp-content/uploads/2018/07/Card-flip-sound-effect.mp3');
        const audioWin = new Audio('https://www.myinstants.com/media/sounds/final-fantasy-vii-victory-fanfare-1.mp3');
        const audioSad = new Audio('https://www.myinstants.com/media/sounds/tf_nemesis.mp3');
        const audioVip = new Audio('https://www.myinstants.com/media/sounds/celebration.mp3');

        // Mở khóa âm thanh bằng dummy play/pause
        function unlockAudio(audio) {
            audio.play().then(() => audio.pause()).catch(() => {});
        }

        // Chơi âm thanh an toàn
        function playAudio(audio) {
            audio.play().catch(() => console.log('Audio play failed, but continuing...'));
        }

        // Rung
        function vibrate(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // LocalStorage
        const storageKey = 'fortune10_5';
        let fortuneData = JSON.parse(localStorage.getItem(storageKey)) || null;

        // Kiểm tra nếu đã gieo, hiển thị kết quả
        if (fortuneData) {
            showAllScreens(false);
            showResult(fortuneData.result, fortuneData.type);
        }

        // Mảng 200 quẻ (ví dụ, mở rộng thực tế)
        const fortunes = [
            // Quẻ ổn/vui (100 cái, ví dụ 5)
            '2026 của bạn sẽ siêu chill, crush like post liên tục!',
            'Năm mới tiền đầy túi, game rank lên pro!',
            'Bạn sẽ crush thành công, date cafe free!',
            'Học hành đỉnh cao, điểm 10 bay tùm lum!',
            'Party tẹt ga, bạn bè quẩy max vol!',

            // Thêm 95 cái tương tự... (bạn cần mở rộng để đủ 100)

            // Quẻ bình thường (50 cái, ví dụ 5)
            '2026 ổn áp, không drama gì to tát.',
            'Cuộc sống bình yên, Netflix chill hàng ngày.',
            'Công việc đều đều, lương về đúng hạn.',
            'Bạn bè vẫn thế, không ai ghost bạn.',
            'Sức khỏe ok, không ốm vặt nữa.',

            // Thêm 45...

            // Quẻ xui (49 cái, ví dụ 5, kèm lời khuyên)
            '2026 hơi xui, dễ bị ghost bởi crush. Mua nước tại quầy 10/5 để giải nghiệp!',
            'Tiền tiêu vèo vèo, ví mỏng teo. Mua nước tại quầy 10/5 để giải nghiệp!',
            'Học hành trục trặc, điểm thấp tí. Mua nước tại quầy 10/5 để giải nghiệp!',
            'Bạn bè drama, cãi vã linh tinh. Mua nước tại quầy 10/5 để giải nghiệp!',
            'Sức khỏe lẹt đẹt, mệt mỏi thường. Mua nước tại quầy 10/5 để giải nghiệp!',

            // Thêm 44...

            // Một số có quà (tích hợp random)
        ];
        // Để đủ 200, mở rộng mảng. Hiện dùng placeholder.

        // Quẻ VIP
        const vipFortune = '💎 THIẾU GIA VIP 10/5! Quà đặc biệt chờ bạn tại quầy!';

        // Hàm random quẻ
        function getRandomFortune(birthdate) {
            if (birthdate === '2010-06-25') {
                return { result: vipFortune, type: 'vip' };
            }
            const index = Math.floor(Math.random() * fortunes.length);
            const type = index < 100 ? 'good' : index < 150 ? 'normal' : 'bad';
            let result = fortunes[index];
            // Random thêm quà cho một số quẻ (ví dụ 10% cơ hội)
            if (Math.random() < 0.1 && type !== 'bad') {
                result += ' Nhận móc khóa quà từ 10/5!';
            }
            return { result, type };
        }

        // Ẩn hiện màn
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showAllScreens(show) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = show ? 'block' : 'none');
        }

        // Confetti mượt hơn với requestAnimationFrame
        function confetti(isVip = false) {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const particles = [];
            const numParticles = isVip ? 300 : 100;
            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 4 + 1,
                    d: Math.random() * numParticles / 100,
                    color: `hsl(${Math.random()*360}, 100%, 50%)`,
                    tilt: Math.random() * 10 - 10,
                    tiltAngleIncremental: (Math.random() * 0.07) + .05,
                    tiltAngle: 0
                });
            }
            let animationFrame;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.tilt = Math.sin(p.tiltAngle) * 15;
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + (p.r / 4), p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 4));
                    ctx.stroke();
                    if (p.y > canvas.height + 20) particles.splice(index, 1);
                });
                if (particles.length > 0) {
                    animationFrame = requestAnimationFrame(draw);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            draw();
            setTimeout(() => cancelAnimationFrame(animationFrame), isVip ? 10000 : 5000);
        }

        // Hiển thị kết quả với animation modal
        function showResult(text, type) {
            document.getElementById('result-text').innerText = text;
            const modal = document.getElementById('result-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('visible'), 10);
            vibrate(type === 'vip' ? [100, 50, 100, 50, 100] : [50]);
            if (type === 'good' || type === 'vip') {
                playAudio(type === 'vip' ? audioVip : audioWin);
                confetti(type === 'vip');
            } else if (type === 'bad') {
                playAudio(audioSad);
            }
        }

        // Event listeners
        document.getElementById('confirm1').addEventListener('click', () => {
            playAudio(audioClick);
            unlockAudio(audioShake); // Mở khóa
            vibrate(50);
            showScreen('screen2');
        });

        document.getElementById('confirm2').addEventListener('click', () => {
            playAudio(audioClick);
            unlockAudio(audioFlip); // Mở khóa thêm
            vibrate(50);
            showScreen('screen-birthdate');
        });

        document.getElementById('cast').addEventListener('click', () => {
            const birthdate = document.getElementById('birthdate').value;
            if (!birthdate) return alert('Nhập ngày sinh đi bro!');
            playAudio(audioClick);
            vibrate(50);
            showScreen('screen-jar');
            document.getElementById('jar').classList.add('shaking');
            playAudio(audioShake);
            vibrate([100, 50, 100, 50, 100]); // Rung theo nhịp lắc
            setTimeout(() => {
                document.getElementById('jar').classList.remove('shaking');
                audioShake.pause();
                audioShake.currentTime = 0;
                showScreen('screen-cards');
                // Tạo thẻ quẻ xòe quạt với animation xuất hiện mượt
                const container = document.querySelector('.cards-container');
                container.innerHTML = '';
                for (let i = 0; i < 5; i++) { // Giả sử 5 thẻ
                    const card = document.createElement('div');
                    card.classList.add('card');
                    card.innerHTML = `
                        <div class="card-front"></div>
                        <div class="card-back">Quẻ bí mật!</div>
                    `;
                    card.style.transform = `rotate(${ (i - 2) * 15 }deg) scale(0)`;
                    card.style.opacity = 0;
                    card.style.transition = 'transform 0.5s ease-in-out, opacity 0.5s ease-in-out';
                    container.appendChild(card);
                    setTimeout(() => {
                        card.style.transform = `rotate(${ (i - 2) * 15 }deg) scale(1)`;
                        card.style.opacity = 1;
                    }, i * 100); // Stagger animation
                    card.addEventListener('click', () => {
                        playAudio(audioFlip);
                        vibrate(50);
                        card.classList.add('flipped');
                        setTimeout(() => {
                            const fortune = getRandomFortune(birthdate);
                            localStorage.setItem(storageKey, JSON.stringify(fortune));
                            showResult(fortune.result, fortune.type);
                        }, 600); // Đồng bộ với transition 0.6s
                    });
                }
            }, 2500);
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            const modal = document.getElementById('result-modal');
            modal.classList.remove('visible');
            setTimeout(() => modal.style.display = 'none', 500);
            // Không cho gieo lại
        });

        // Resize confetti
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
