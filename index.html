<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bói Chiêm Tinh 10/5 - Hội Trại Siêu Chill</title>
    <style>
        /* Reset và base styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff5e6; /* Giấy cũ */
            color: #5d4037; /* Gỗ đậm */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            font-size: 18px;
            line-height: 1.5;
            position: relative;
        }
        .container {
            max-width: 100%;
            width: 100%;
            background: rgba(255, 245, 230, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(93, 64, 55, 0.2);
        }
        h1, h2 { color: #c0392b; /* Đỏ đô */ }
        button {
            background: #ffd700; /* Vàng kim */
            color: #5d4037;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin: 20px 0;
            will-change: transform, box-shadow;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 5px 10px rgba(255, 215, 0, 0.5); }
        input[type="date"] {
            padding: 10px;
            font-size: 18px;
            border: 2px solid #c0392b;
            border-radius: 10px;
            margin: 20px 0;
            transition: border-color 0.3s ease-in-out;
        }
        input[type="date"]:focus { border-color: #ffd700; }
        /* Ẩn các màn với transition */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .active {
            display: block;
            opacity: 1;
        }
        /* Ống quẻ - fallback nếu không có jar.png */
        #jar {
            width: 200px;
            height: 280px;
            background: url('jar.png') center/contain no-repeat, linear-gradient(#8b4513, #d2691e); /* Fallback gỗ nếu không có ảnh */
            border: 10px solid #5d4037;
            border-radius: 20px 20px 50px 50px;
            margin: 40px auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s ease-in-out;
            will-change: transform;
        }
        .shaking { 
            animation: shake-strong 0.12s infinite cubic-bezier(0.36, 0.07, 0.19, 0.97); 
        }
        @keyframes shake-strong {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-8px, -12px) rotate(-8deg); }
            20% { transform: translate(12px, -5px) rotate(10deg); }
            30% { transform: translate(-10px, 10px) rotate(-7deg); }
            40% { transform: translate(10px, -10px) rotate(8deg); }
            50% { transform: translate(-15px, 0) rotate(-12deg); }
            60% { transform: translate(15px, 8px) rotate(12deg); }
            70% { transform: translate(-12px, -8px) rotate(-10deg); }
            80% { transform: translate(10px, 12px) rotate(10deg); }
            90% { transform: translate(-10px, -10px) rotate(-8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        /* Que quẻ */
        .sticks-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 200px;
            margin: 40px 0;
            position: relative;
        }
        .stick {
            width: 20px;
            height: 150px;
            background-color: #5d4037;
            margin: 0 10px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), box-shadow 0.3s ease-in-out;
            position: relative;
            border-radius: 5px 5px 0 0;
            box-shadow: 0 0 10px rgba(93, 64, 55, 0.5);
            will-change: transform, box-shadow;
        }
        .stick:hover { box-shadow: 0 0 20px #ffd700; }
        .stick.selected { transform: translateY(-100px); }
        .stick-content {
            position: absolute;
            bottom: -50px;
            width: 100%;
            text-align: center;
            color: #fff5e6;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, bottom 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .stick.selected .stick-content { opacity: 1; bottom: -150px; }
        .stick.disabled { pointer-events: none; opacity: 0.5; }
        /* Modal kết quả */
        #result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        #result-modal.visible { opacity: 1; display: flex; }
        #result-content {
            background: #fff5e6;
            padding: 40px;
            border-radius: 30px;
            max-width: 95%;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #result-modal.visible #result-content { transform: scale(1); }
        #result-title {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #fate-note {
            margin-top: 20px;
            font-style: italic;
            color: #c0392b;
        }
        /* Credit */
        #credit {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: #5d4037;
            opacity: 0.6;
            z-index: 10;
        }
        /* Confetti canvas */
        #confetti-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1000; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Màn 1 -->
        <div id="screen1" class="screen active">
            <h1>Bói Chiêm Tinh Siêu Chill 10/5</h1>
            <p>Bạn đã quét mã coi bói của 10/5?</p>
            <button id="confirm1">ĐỒNG Ý</button>
        </div>

        <!-- Màn 2 -->
        <div id="screen2" class="screen">
            <p>Bạn sẵn sàng để biết 2026 của bạn chưa?</p>
            <button id="confirm2">ĐỒNG Ý</button>
        </div>

        <!-- Màn nhập ngày sinh -->
        <div id="screen-birthdate" class="screen">
            <p>Nhập ngày sinh của bạn để xem horoscope nha!</p>
            <input type="date" id="birthdate">
            <button id="cast">Gieo Quẻ Chiêm Tinh</button>
        </div>

        <!-- Màn lắc ống quẻ (chỉ hình lắc mạnh) -->
        <div id="screen-jar" class="screen">
            <div id="jar"></div>
        </div>

        <!-- Màn rút que -->
        <div id="screen-sticks" class="screen">
            <p>Rút một que để xem horoscope 2026 của cung bạn đi!</p>
            <div class="sticks-container"></div>
        </div>

        <!-- Modal kết quả -->
        <div id="result-modal">
            <div id="result-content">
                <h2 id="result-title">Horoscope 2026 cho <span id="zodiac-name"></span> của bạn</h2>
                <p id="result-text"></p>
                <p id="fate-note">Vận mệnh an bài, không cho gieo lại đâu nha!</p>
                <button id="close-modal">OK, Đã Rõ!</button>
            </div>
        </div>
    </div>

    <div id="credit">dev by hai duong</div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        // Âm thanh - thay URL rõ ràng, lách cách gỗ mạnh + preload
        const audioClick = new Audio('https://orangefreesounds.com/wp-content/uploads/2023/03/Mechanical-button-click-sound-effect.mp3');
        const audioShake = new Audio('https://freesound.org/data/previews/320/320753_5260874-lq.mp3'); // Tiếng gỗ lách cách mạnh hơn
        audioShake.loop = true;
        audioShake.volume = 0.8; // Tăng volume lắc
        const audioFlip = new Audio('https://orangefreesounds.com/wp-content/uploads/2018/07/Card-flip-sound-effect.mp3');
        const audioWin = new Audio('https://orangefreesounds.com/wp-content/uploads/2020/09/Win-sound-effect.mp3?_=1');
        audioWin.volume = 0.8;
        const audioSad = new Audio('https://orangefreesounds.com/wp-content/uploads/2021/12/Sad-violin-sound.mp3?_=1');
        audioSad.volume = 0.7;
        const audioVip = new Audio('https://orangefreesounds.com/wp-content/uploads/2022/02/Celebration-sound-effect.mp3?_=1');
        audioVip.volume = 0.9;
        const audioTaDa = new Audio('https://orangefreesounds.com/wp-content/uploads/2020/09/Win-sound-effect.mp3?_=1');
        audioTaDa.volume = 0.8;

        const allAudios = [audioClick, audioShake, audioFlip, audioWin, audioSad, audioVip, audioTaDa];

        // Preload tất cả audio để chắc load
        allAudios.forEach(audio => {
            audio.preload = 'auto';
            audio.load();
        });

        function unlockAudio(audio) {
            const promise = audio.play();
            if (promise !== undefined) {
                promise.then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                }).catch(() => {});
            }
        }

        function unlockAllAudios() {
            allAudios.forEach(unlockAudio);
        }

        function playAudio(audio) {
            audio.currentTime = 0;
            audio.volume = audio.volume || 0.7; // Default volume
            const promise = audio.play();
            if (promise !== undefined) {
                promise.catch(error => console.log('Play failed:', error));
            }
        }

        function vibrate(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        const storageKey = 'fortune10_5';
        let fortuneData = JSON.parse(localStorage.getItem(storageKey)) || null;

        if (fortuneData) {
            showAllScreens(false);
            showResult(fortuneData);
        } else {
            showScreen('screen1');
        }

        // (Giữ nguyên hàm getZodiacSign, zodiacFortunes, vipFortune, getRandomFortune như code trước)

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showAllScreens(show) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = show ? 'block' : 'none');
        }

        function confetti(isVip = false) {
            // (Giữ nguyên confetti)
        }

        function showResult(fortune) {
            document.getElementById('zodiac-name').innerText = fortune.zodiac || 'bạn';
            document.getElementById('result-text').innerText = fortune.result;
            const modal = document.getElementById('result-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('visible'), 10);
            vibrate(fortune.type === 'vip' ? [100, 50, 100, 50, 100] : [50]);
            playAudio(audioTaDa); // Tiếng "ta da" khi hiện
            setTimeout(() => { // Delay nhẹ để tiếng vui/buồn rõ sau ta da
                if (fortune.type === 'vip') {
                    playAudio(audioVip);
                    confetti(true);
                } else if (fortune.type === 'good' || fortune.type === 'normal') {
                    playAudio(audioWin);
                    if (fortune.type === 'good') confetti(false);
                } else if (fortune.type === 'bad') {
                    playAudio(audioSad);
                }
            }, 300);
            showAllScreens(false);
        }

        // Event listeners
        document.getElementById('confirm1').addEventListener('click', () => {
            unlockAllAudios();
            playAudio(audioClick);
            vibrate(50);
            showScreen('screen2');
        });

        document.getElementById('confirm2').addEventListener('click', () => {
            unlockAllAudios();
            playAudio(audioClick);
            vibrate(50);
            showScreen('screen-birthdate');
        });

        document.getElementById('cast').addEventListener('click', () => {
            const birthdate = document.getElementById('birthdate').value;
            if (!birthdate) return alert('Nhập ngày sinh đi bro!');
            playAudio(audioClick);
            vibrate(50);
            showScreen('screen-jar');
            const jar = document.getElementById('jar');
            jar.classList.add('shaking');
            playAudio(audioShake); // Tiếng lách cách chắc chắn play
            audioShake.volume = 0.9; // Tăng volume lắc
            vibrate([150, 80, 150, 80, 150, 80, 150, 80, 150]); // Rung mạnh liên tục
            setTimeout(() => {
                jar.classList.remove('shaking');
                audioShake.pause();
                audioShake.currentTime = 0;
                showScreen('screen-sticks');
                // (Giữ nguyên phần tạo que)
                const container = document.querySelector('.sticks-container');
                container.innerHTML = '';
                let selected = false;
                for (let i = 0; i < 6; i++) {
                    const stick = document.createElement('div');
                    stick.classList.add('stick');
                    stick.innerHTML = `<div class="stick-content">Quẻ bí mật!</div>`;
                    stick.style.transform = `rotate(${ (i - 2.5) * 5 }deg)`;
                    stick.style.opacity = 0;
                    container.appendChild(stick);
                    setTimeout(() => stick.style.opacity = 1, i * 100);
                    stick.addEventListener('click', () => {
                        if (selected) return;
                        selected = true;
                        playAudio(audioClick);
                        vibrate(50);
                        stick.classList.add('selected');
                        document.querySelectorAll('.stick:not(.selected)').forEach(s => s.classList.add('disabled'));
                        setTimeout(() => {
                            playAudio(audioFlip);
                            const fortune = getRandomFortune(birthdate);
                            localStorage.setItem(storageKey, JSON.stringify(fortune));
                            showResult(fortune);
                        }, 600);
                    });
                }
            }, 2500);
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            const modal = document.getElementById('result-modal');
            modal.classList.remove('visible');
            setTimeout(() => modal.style.display = 'none', 500);
        });

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        document.addEventListener('touchstart', unlockAllAudios, { once: true });
    </script>
</body>
</html>
