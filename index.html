<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bói Quẻ 10/5 - Hội Trại Siêu Chill</title>
    <style>
        /* Reset và base styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff5e6; /* Giấy cũ */
            color: #5d4037; /* Gỗ đậm */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            font-size: 18px;
            line-height: 1.5;
        }
        .container {
            max-width: 100%;
            width: 100%;
            background: rgba(255, 245, 230, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(93, 64, 55, 0.2);
        }
        h1, h2 { color: #c0392b; /* Đỏ đô */ }
        button {
            background: #ffd700; /* Vàng kim */
            color: #5d4037;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin: 20px 0;
            will-change: transform, box-shadow;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 5px 10px rgba(255, 215, 0, 0.5); }
        input[type="date"] {
            padding: 10px;
            font-size: 18px;
            border: 2px solid #c0392b;
            border-radius: 10px;
            margin: 20px 0;
            transition: border-color 0.3s ease-in-out;
        }
        input[type="date"]:focus { border-color: #ffd700; }
        /* Ẩn các màn với transition */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .active {
            display: block;
            opacity: 1;
        }
        /* Ống quẻ */
        #jar {
            width: 150px;
            height: 200px;
            background: url('jar.png') center/contain no-repeat; /* Giả định file jar.png */
            margin: 40px auto;
            transition: transform 0.1s ease-in-out;
            will-change: transform;
        }
        .shaking { animation: shake 0.3s infinite cubic-bezier(0.36, 0.07, 0.19, 0.97); }
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-2px, -1px) rotate(-2deg); }
            20% { transform: translate(2px, 1px) rotate(2deg); }
            30% { transform: translate(-1px, 2px) rotate(-1deg); }
            40% { transform: translate(1px, -2px) rotate(1deg); }
            50% { transform: translate(-3px, 0) rotate(-3deg); }
            60% { transform: translate(3px, 1px) rotate(3deg); }
            70% { transform: translate(-2px, -1px) rotate(-2deg); }
            80% { transform: translate(2px, 2px) rotate(2deg); }
            90% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        /* Que quẻ */
        .sticks-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 200px;
            margin: 40px 0;
            position: relative;
        }
        .stick {
            width: 20px;
            height: 150px;
            background-color: #5d4037; /* Gỗ đậm */
            margin: 0 10px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), box-shadow 0.3s ease-in-out;
            position: relative;
            border-radius: 5px 5px 0 0;
            box-shadow: 0 0 10px rgba(93, 64, 55, 0.5);
            will-change: transform, box-shadow;
        }
        .stick:hover { box-shadow: 0 0 20px #ffd700; }
        .stick.selected { transform: translateY(-100px); }
        .stick-content {
            position: absolute;
            bottom: -50px;
            width: 100%;
            text-align: center;
            color: #fff5e6;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, bottom 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            will-change: opacity, bottom;
        }
        .stick.selected .stick-content { opacity: 1; bottom: -150px; }
        .stick.disabled { pointer-events: none; opacity: 0.5; transition: opacity 0.3s ease-in-out; }
        /* Modal kết quả lớn hơn */
        #result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            will-change: opacity;
        }
        #result-modal.visible { opacity: 1; display: flex; }
        #result-content {
            background: #fff5e6;
            padding: 40px;
            border-radius: 30px;
            max-width: 95%;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            will-change: transform;
        }
        #result-modal.visible #result-content { transform: scale(1); }
        #fate-note {
            margin-top: 20px;
            font-style: italic;
            color: #c0392b;
        }
        /* Confetti canvas */
        #confetti-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1000; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Màn 1: Xác nhận quét mã -->
        <div id="screen1" class="screen active">
            <h1>Bói Quẻ Siêu Chill 10/5</h1>
            <p>Bạn đã quét mã coi bói của 10/5?</p>
            <button id="confirm1">ĐỒNG Ý</button>
        </div>

        <!-- Màn 2: Xác nhận sẵn sàng -->
        <div id="screen2" class="screen">
            <p>Bạn sẵn sàng để biết 2026 của bạn chưa?</p>
            <button id="confirm2">ĐỒNG Ý</button>
        </div>

        <!-- Màn nhập ngày sinh -->
        <div id="screen-birthdate" class="screen">
            <p>Nhập ngày sinh của bạn để gieo quẻ nha!</p>
            <input type="date" id="birthdate">
            <button id="cast">Gieo Quẻ</button>
        </div>

        <!-- Màn lắc ống quẻ -->
        <div id="screen-jar" class="screen">
            <p>Đang gieo quẻ...</p>
            <div id="jar"></div>
        </div>

        <!-- Màn rút que -->
        <div id="screen-sticks" class="screen">
            <p>Rút một que đi, vận mệnh đang chờ!</p>
            <div class="sticks-container"></div>
        </div>

        <!-- Modal kết quả -->
        <div id="result-modal">
            <div id="result-content">
                <h2>Kết Quả Quẻ Của Bạn</h2>
                <p id="result-text"></p>
                <p id="fate-note">Vận mệnh an bài, không cho gieo lại đâu nha!</p>
                <button id="close-modal">OK, Đã Rõ!</button>
            </div>
        </div>
    </div>

    <canvas id="confetti-canvas" width="300" height="300"></canvas>

    <script>
        // Âm thanh (thay URL mới để tránh lộn xộn, royalty-free)
        const audioClick = new Audio('https://orangefreesounds.com/wp-content/uploads/2023/03/Mechanical-button-click-sound-effect.mp3');
        const audioShake = new Audio('https://orangefreesounds.com/wp-content/uploads/2021/03/Wooden-rattle-sound-effect.mp3?_=1');
        audioShake.loop = true;
        const audioFlip = new Audio('https://orangefreesounds.com/wp-content/uploads/2018/07/Card-flip-sound-effect.mp3');
        const audioWin = new Audio('https://orangefreesounds.com/wp-content/uploads/2020/09/Win-sound-effect.mp3?_=1');
        const audioSad = new Audio('https://orangefreesounds.com/wp-content/uploads/2021/12/Sad-violin-sound.mp3?_=1');
        const audioVip = new Audio('https://orangefreesounds.com/wp-content/uploads/2022/02/Celebration-sound-effect.mp3?_=1');
        const audioTaDa = new Audio('https://orangefreesounds.com/wp-content/uploads/2020/09/Win-sound-effect.mp3?_=1'); // Tiếng ta da (giống win)

        // Mảng tất cả audio để unlock
        const allAudios = [audioClick, audioShake, audioFlip, audioWin, audioSad, audioVip, audioTaDa];

        // Mở khóa âm thanh bằng dummy play/pause
        function unlockAudio(audio) {
            const promise = audio.play();
            if (promise !== undefined) {
                promise.then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                }).catch(error => {
                    console.log('Unlock audio failed:', error);
                });
            }
        }

        // Unlock tất cả audio
        function unlockAllAudios() {
            allAudios.forEach(unlockAudio);
        }

        // Chơi âm thanh an toàn
        function playAudio(audio) {
            audio.currentTime = 0;
            const promise = audio.play();
            if (promise !== undefined) {
                promise.catch(error => {
                    console.log('Audio play failed:', error);
                });
            }
        }

        // Rung
        function vibrate(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // LocalStorage
        const storageKey = 'fortune10_5';
        let fortuneData = JSON.parse(localStorage.getItem(storageKey)) || null;

        // Kiểm tra nếu đã gieo, hiển thị kết quả
        if (fortuneData) {
            showAllScreens(false);
            showResult(fortuneData.result, fortuneData.type);
        } else {
            showScreen('screen1');
        }

        // Mảng 200 quẻ không trùng (giữ nguyên)
        const fortunes = [
            // ... (copy đầy đủ từ code trước)
        ];

        // Quẻ VIP
        const vipFortune = '💎 THIẾU GIA VIP 10/5! Quà đặc biệt chờ bạn tại quầy!';

        // Hàm random quẻ
        function getRandomFortune(birthdate) {
            if (birthdate === '2010-06-25') {
                return { result: vipFortune, type: 'vip' };
            }
            const index = Math.floor(Math.random() * fortunes.length);
            const type = index < 100 ? 'good' : index < 150 ? 'normal' : 'bad';
            let result = fortunes[index];
            if (Math.random() < 0.1 && type !== 'bad') {
                result += ' Nhận móc khóa quà từ 10/5!';
            }
            return { result, type };
        }

        // Ẩn hiện màn
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
            });
            const target = document.getElementById(id);
            target.classList.add('active');
        }

        function showAllScreens(show) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = show ? 'block' : 'none');
        }

        // Confetti
        function confetti(isVip = false) {
            // ... (giữ nguyên code confetti từ trước)
        }

        // Hiển thị kết quả
        function showResult(text, type) {
            document.getElementById('result-text').innerText = text;
            const modal = document.getElementById('result-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('visible'), 10);
            vibrate(type === 'vip' ? [100, 50, 100, 50, 100] : [50]);
            playAudio(audioTaDa); // Tiếng ta da khi hiện modal
            if (type === 'vip') {
                playAudio(audioVip);
                confetti(true);
            } else if (type === 'good' || type === 'normal') {
                playAudio(audioWin);
                if (type === 'good') confetti(false);
            } else if (type === 'bad') {
                playAudio(audioSad);
            }
            // Ẩn tất cả screen để dừng ở modal
            showAllScreens(false);
            modal.style.display = 'flex';
        }

        // Event listeners
        document.getElementById('confirm1').addEventListener('click', () => {
            unlockAllAudios();
            playAudio(audioClick);
            vibrate(50);
            showScreen('screen2');
        });

        document.getElementById('confirm2').addEventListener('click', () => {
            unlockAllAudios();
            playAudio(audioClick);
            vibrate(50);
            showScreen('screen-birthdate');
        });

        document.getElementById('cast').addEventListener('click', () => {
            const birthdate = document.getElementById('birthdate').value;
            if (!birthdate) return alert('Nhập ngày sinh đi bro!');
            playAudio(audioClick);
            vibrate(50);
            showScreen('screen-jar');
            document.getElementById('jar').classList.add('shaking');
            playAudio(audioShake);
            vibrate([100, 50, 100, 50, 100]);
            setTimeout(() => {
                document.getElementById('jar').classList.remove('shaking');
                audioShake.pause();
                audioShake.currentTime = 0;
                showScreen('screen-sticks');
                const container = document.querySelector('.sticks-container');
                container.innerHTML = '';
                let selected = false;
                for (let i = 0; i < 6; i++) {
                    const stick = document.createElement('div');
                    stick.classList.add('stick');
                    stick.innerHTML = `<div class="stick-content">Quẻ bí mật!</div>`;
                    stick.style.transform = `rotate(${ (i - 2.5) * 5 }deg)`;
                    stick.style.opacity = 0;
                    stick.style.transition = 'opacity 0.5s ease-in-out';
                    container.appendChild(stick);
                    setTimeout(() => {
                        stick.style.opacity = 1;
                    }, i * 100);
                    stick.addEventListener('click', () => {
                        if (selected) return;
                        selected = true;
                        playAudio(audioClick); // Tiếng tách khi chọn que
                        vibrate(50);
                        stick.classList.add('selected');
                        document.querySelectorAll('.stick:not(.selected)').forEach(s => s.classList.add('disabled'));
                        setTimeout(() => {
                            playAudio(audioFlip); // Tiếng soẹt khi hiện
                            const fortune = getRandomFortune(birthdate);
                            localStorage.setItem(storageKey, JSON.stringify(fortune));
                            showResult(fortune.result, fortune.type);
                        }, 600);
                    });
                }
            }, 2500);
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            const modal = document.getElementById('result-modal');
            modal.classList.remove('visible');
            setTimeout(() => modal.style.display = 'none', 500);
            // Không quay lại màn chọn que, có thể show screen-birthdate hoặc gì đó, nhưng theo yêu cầu dừng ở modal nên không cần
        });

        // Resize confetti
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Unlock on touchstart
        document.addEventListener('touchstart', unlockAllAudios, { once: true });
    </script>
</body>
</html>
