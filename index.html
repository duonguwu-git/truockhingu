    function getRandomFortune(birthdateStr) {
        // Xử lý ngày sinh để lấy cung hoàng đạo
        const dateObj = new Date(birthdateStr);
        const day = dateObj.getDate();
        const month = dateObj.getMonth() + 1;
        const zodiac = getZodiac(day, month);
        
        // Tạo con số may mắn ngẫu nhiên từ 0-99
        const luckyNum = Math.floor(Math.random() * 100);

        // Easter Egg: Nếu sinh nhật trùng ngày hội trại hoặc ngày đặc biệt
        if (birthdateStr.endsWith('05-10') || birthdateStr.endsWith('10-05')) {
            return { ...vipFortune, zodiac, luckyNum };
        }

        // Random có trọng số dựa trên cảm xúc
        // Tỷ lệ: 40% Good, 30% Normal, 30% Bad (Bad có CTA bán hàng)
        const rand = Math.random();
        let selectedFortune;
        
        if (rand < 0.45) {
            // Lấy quẻ tốt
            const goodList = fortunes.filter(f => f.type === 'good');
            selectedFortune = goodList[Math.floor(Math.random() * goodList.length)];
        } else if (rand < 0.75) {
            // Lấy quẻ thường
            const normalList = fortunes.filter(f => f.type === 'normal');
            selectedFortune = normalList[Math.floor(Math.random() * normalList.length)];
        } else {
            // Lấy quẻ xui (để bán hàng)
            const badList = fortunes.filter(f => f.type === 'bad');
            selectedFortune = badList[Math.floor(Math.random() * badList.length)];
        }

        return { text: selectedFortune.text, type: selectedFortune.type, zodiac, luckyNum };
    }

    function showAllScreens(show) {

    // Canvas Confetti (Hiệu ứng pháo giấy)
    function confetti(isVip = false) {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particles = [];
        const numParticles = isVip ? 400 : 150;
        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                r: Math.random() * 4 + 1,
                d: Math.random() * numParticles / 100,
                color: `hsl(${Math.random()*360}, 100%, 50%)`,
                tilt: Math.random() * 10 - 10,
                tiltAngleIncremental: (Math.random() * 0.07) + .05,
                tiltAngle: 0
            });
        }
        let animationFrame;
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleIncremental;
                p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                p.tilt = Math.sin(p.tiltAngle) * 15;
                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + (p.r / 4), p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 4));
                ctx.stroke();
                if (p.y > canvas.height + 20) particles.splice(index, 1);
            });
            if (particles.length > 0) animationFrame = requestAnimationFrame(draw);
        }
        draw();
    }

    function showResult(text, type, zodiac, luckyNum) {
        const title = document.getElementById('result-title');
        const content = document.getElementById('result-text');
        
        // Cập nhật nội dung hiển thị phong phú hơn
        title.innerHTML = `Quẻ Của ${zodiac}`;

            <div style="font-size: 40px; margin-bottom: 10px;">${type === 'good' ? '🌸' : type === 'bad' ? '⚡' : '🍃'}</div>
            <strong>Lời phán:</strong><br>${text}<br><br>
            <span style="color: #c0392b; font-weight: bold;">Số may mắn: ${luckyNum}</span>
        `;

        const modal = document.getElementById('result-modal');
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('visible'), 10);
        vibrate(type === 'vip' ? [100, 50, 100, 50, 100] : [50]);
        playAudio(audioTaDa);
        
        setTimeout(() => {
            if (type === 'vip') {
                playAudio(audioVip); confetti(true);
            } else if (type === 'good') {
                playAudio(audioWin); confetti(false);
            } else if (type === 'bad') {
                playAudio(audioSad);
            } else {
                playAudio(audioWin);
            }
        }, 400);
        showAllScreens(false);
    }
