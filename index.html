<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xóc Quẻ Định Mệnh</title>

<style>
:root{
  --do:#c0392b;
  --vang:#ffd700;
  --giay:#fff5e6;
  --go:#5d4037;
}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  margin:0;
  background:linear-gradient(#3e2723,#1b0000);
  color:#3e2723;
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--giay);
  padding:20px;
  text-align:center;
}
h1{color:var(--do)}
button{
  background:var(--do);
  color:white;
  border:none;
  padding:14px 20px;
  border-radius:12px;
  font-size:16px;
  margin-top:15px;
  width:100%;
}
button:active{transform:scale(0.96)}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:2px solid var(--go);
  font-size:16px;
}
.hidden{display:none}

/* Ống quẻ */
.jar{
  font-size:100px;
  margin:20px 0;
}
.shake{
  animation:shake 0.2s infinite;
}
@keyframes shake{
  0%{transform:rotate(0)}
  25%{transform:rotate(5deg)}
  50%{transform:rotate(0)}
  75%{transform:rotate(-5deg)}
}

/* Quẻ */
.cards{
  display:flex;
  justify-content:center;
  margin-top:30px;
  position:relative;
  height:160px;
}
.card{
  width:80px;
  height:140px;
  background:linear-gradient(#fff,#f5e6c8);
  border:3px solid var(--go);
  border-radius:12px;
  position:absolute;
  transform-origin:bottom center;
  cursor:pointer;
}
.card:nth-child(1){transform:rotate(-25deg) translateX(-120px)}
.card:nth-child(2){transform:rotate(-15deg) translateX(-70px)}
.card:nth-child(3){transform:rotate(-5deg) translateX(-20px)}
.card:nth-child(4){transform:rotate(5deg) translateX(20px)}
.card:nth-child(5){transform:rotate(15deg) translateX(70px)}
.card:nth-child(6){transform:rotate(25deg) translateX(120px)}

.result{
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  background:#fff;
  border:2px dashed var(--do);
}
.good{color:green}
.bad{color:#555}
.vip{
  background:linear-gradient(45deg,#ffd700,#ffecb3);
  animation:glow 1s infinite alternate;
}
@keyframes glow{
  from{box-shadow:0 0 5px gold}
  to{box-shadow:0 0 20px gold}
}
.gift{
  color:red;
  font-weight:bold;
  margin-top:10px;
}

/* Confetti */
canvas{
  position:fixed;
  top:0;left:0;
  pointer-events:none;
}
</style>
</head>

<body>
<div class="app">

<h1>🔮 XÓC QUẺ ĐỊNH MỆNH</h1>

<div id="step1">
  <p>Bạn có tin vào định mệnh?</p>
  <button onclick="nextStep(1)">Tôi tin</button>
</div>

<div id="step2" class="hidden">
  <p>Mỗi người chỉ bốc một lần, sẵn sàng chưa?</p>
  <button onclick="nextStep(2)">Sẵn sàng</button>
</div>

<div id="step3" class="hidden">
  <p>Nhập ngày sinh của bạn</p>
  <input type="date" id="dob">
  <button onclick="startShake()">Lắc quẻ</button>
</div>

<div id="shakeArea" class="hidden">
  <div id="jar" class="jar">🏺</div>
  <p>Đang lắc quẻ...</p>
</div>

<div id="cardsArea" class="hidden">
  <p>Chọn 1 quẻ</p>
  <div class="cards">
    <div class="card" onclick="pickCard()"></div>
    <div class="card" onclick="pickCard()"></div>
    <div class="card" onclick="pickCard()"></div>
    <div class="card" onclick="pickCard()"></div>
    <div class="card" onclick="pickCard()"></div>
    <div class="card" onclick="pickCard()"></div>
  </div>
</div>

<div id="resultArea" class="hidden"></div>

</div>

<canvas id="confetti"></canvas>

<audio id="click" src="https://cdn.pixabay.com/audio/2022/03/15/audio_7c6c9d35b6.mp3"></audio>
<audio id="shakeSound" src="https://cdn.pixabay.com/audio/2022/10/25/audio_8b0a4c2c2b.mp3" loop></audio>
<audio id="swipe" src="https://cdn.pixabay.com/audio/2022/03/10/audio_5c3c8c7b2f.mp3"></audio>
<audio id="win" src="https://cdn.pixabay.com/audio/2022/08/04/audio_4a3c7e7f1a.mp3"></audio>
<audio id="sad" src="https://cdn.pixabay.com/audio/2022/11/16/audio_7f1c6b2f4d.mp3"></audio>

<script>
const fortunes = [
"Đại cát – sắp có lộc ăn uống",
"Tiểu cát – hôm nay gặp người dễ thương",
"Xui nhẹ – nhớ coi chừng rớt đồ. Mua nước tại quầy 10/5 để giải nghiệp",
"Xui – làm gì cũng từ từ. Mua nước tại quầy 10/5 để giải nghiệp",
"Đại cát – vận may tài chính",
"Trung bình – bình tĩnh là thắng",
"Xui meme – ngủ sớm đi. Mua nước tại quầy 10/5 để giải nghiệp"
];
// nhân lên cho đủ ~70
while(fortunes.length<70) fortunes.push(...fortunes);

let dobGlobal="";

if(localStorage.getItem("fortuneResult")){
  showResult(JSON.parse(localStorage.getItem("fortuneResult")),true);
}

function play(id){document.getElementById(id).play();}

function nextStep(n){
  play("click");
  document.getElementById("step"+n).classList.add("hidden");
  document.getElementById("step"+(n+1)).classList.remove("hidden");
}

function startShake(){
  play("click");
  dobGlobal=document.getElementById("dob").value;
  if(!dobGlobal) return alert("Nhập ngày sinh!");
  document.getElementById("step3").classList.add("hidden");
  document.getElementById("shakeArea").classList.remove("hidden");
  const jar=document.getElementById("jar");
  jar.classList.add("shake");
  play("shakeSound");
  setTimeout(()=>{
    jar.classList.remove("shake");
    document.getElementById("shakeSound").pause();
    document.getElementById("shakeArea").classList.add("hidden");
    document.getElementById("cardsArea").classList.remove("hidden");
  },2500);
}

function pickCard(){
  play("swipe");
  document.getElementById("cardsArea").classList.add("hidden");

  let result;
  if(dobGlobal==="2010-06-25"){
    result={text:"💎 THIẾU GIA VIP 10/5",type:"vip",gift:true};
  }else{
    const text=fortunes[Math.floor(Math.random()*fortunes.length)];
    result={
      text,
      type: text.includes("Xui")?"bad":"good",
      gift: text.includes("Đại cát")
    };
  }
  localStorage.setItem("fortuneResult",JSON.stringify(result));
  showResult(result,false);
}

function showResult(result,loaded){
  document.getElementById("resultArea").classList.remove("hidden");
  let html=`<div class="result ${result.type}">${result.text}</div>`;
  if(result.gift){
    html+=`<div class="gift">Hãy mang màn hình này đến gặp nhân viên quầy 10/5 để nhận quà!</div>`;
  }
  document.getElementById("resultArea").innerHTML=html;

  if(!loaded){
    if(result.type==="good"||result.type==="vip"){play("win");confetti();}
    else play("sad");
  }
}

function confetti(){
  const c=document.getElementById("confetti");
  const ctx=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;
  let pieces=Array.from({length:120},()=>({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    r:Math.random()*6+4,
    dy:Math.random()*3+2
  }));
  let t=0;
  (function anim(){
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p=>{
      ctx.fillStyle=["#c0392b","#ffd700","#5d4037"][Math.floor(Math.random()*3)];
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      p.y+=p.dy;
    });
    if(t++<120) requestAnimationFrame(anim);
  })();
}
</script>
</body>
</html>
