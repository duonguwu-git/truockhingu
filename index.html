<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bói Quẻ 10/5 - Phiên Bản Bất Tử Âm Thanh</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff5e6; color: #5d4037; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; text-align: center; padding: 20px; overflow: hidden;
        }
        .container {
            width: 100%; max-width: 420px; background: #ffffff;
            border-radius: 25px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 { color: #c0392b; margin-bottom: 20px; font-size: 24px; }
        button {
            background: #ffd700; color: #5d4037; border: none; padding: 18px;
            font-size: 18px; border-radius: 15px; cursor: pointer;
            margin: 10px 0; font-weight: bold; width: 100%;
        }
        input[type="date"] { padding: 15px; font-size: 18px; border: 2px solid #c0392b; border-radius: 12px; width: 100%; margin: 20px 0; }
        .screen { display: none; }
        .active { display: block; }

        /* Bình quẻ */
        #jar-container { position: relative; width: 180px; margin: 30px auto; cursor: pointer; }
        #jar {
            width: 150px; height: 220px; background: linear-gradient(#8b4513, #d2691e);
            border: 8px solid #5d4037; border-radius: 20px 20px 50px 50px;
        }
        .shaking { animation: shake 0.1s infinite; }
        @keyframes shake { 0% {transform: rotate(0);} 25% {transform: rotate(-10deg);} 75% {transform: rotate(10deg);} }

        /* Thẻ quẻ */
        .sticks-container { display: flex; justify-content: center; align-items: flex-end; height: 160px; margin: 20px 0; }
        .stick { width: 25px; height: 130px; background: #8b4513; margin: 0 6px; border-radius: 8px 8px 0 0; cursor: pointer; transition: 0.3s; }
        .stick.selected { transform: translateY(-80px); background: #ffd700; border: 2px solid #c0392b; }

        /* Kết quả */
        #result-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 99; padding: 20px;
        }
        #checkin-board { background: white; border: 5px solid #c0392b; border-radius: 20px; padding: 25px; width: 100%; }
        #timer-box { background: #ff4757; color: white; padding: 10px; border-radius: 10px; margin: 15px 0; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="screen1" class="screen active">
            <h1>🔮 XIN QUẺ LỚP 10/5</h1>
            <p>Khám phá vận mệnh & Nhận quà</p>
            <button id="btn-start">BẮT ĐẦU XIN QUẺ</button>
        </div>

        <div id="screen-date" class="screen">
            <p>Chọn ngày sinh của bạn:</p>
            <input type="date" id="birthdate">
            <button id="btn-confirm-date">TIẾP TỤC</button>
        </div>

        <div id="screen-jar" class="screen">
            <div id="jar-container">
                <div id="jar"></div>
            </div>
            <p>🔥 <b>BẤM VÀO BÌNH ĐỂ LẮC</b> 🔥</p>
        </div>

        <div id="screen-sticks" class="screen">
            <p>Chạm vào 1 quẻ để rút:</p>
            <div class="sticks-container" id="sticks-box"></div>
        </div>
    </div>

    <div id="result-modal">
        <div id="checkin-board">
            <h2 style="color: #c0392b">📜 THÁNH QUẺ CHỈ DẪN</h2>
            <div id="fortune-msg" style="margin: 20px 0; font-size: 18px;"></div>
            <div id="timer-box">⏳ HẠN LỘC: <span id="clock">15:00</span></div>
            <div id="gift-box" style="background: #fff5e6; padding: 15px; border-radius: 10px; border: 2px dashed #c0392b; font-weight: bold; color: #c0392b;">
                Đang chờ nhận lộc...
            </div>
            <button id="btn-gift">🎁 NHẬN LỘC MAY MẮN</button>
        </div>
    </div>

    <script>
        // --- KHỞI TẠO ÂM THANH BẰNG THƯ VIỆN HOWLER ---
        const soundClick = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'] });
        const soundShake = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/1074/1074-preview.mp3'], loop: true });
        const soundSwipe = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'] });
        const soundWin = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3'] });

        function nav(id) {
            soundClick.play();
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => {
                document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
                document.getElementById(id).style.display = 'block';
                setTimeout(() => document.getElementById(id).classList.add('active'), 50);
            }, 300);
        }

        // BẮT ĐẦU: Quan trọng nhất để mở khóa âm thanh trên iPhone/Android
        document.getElementById('btn-start').onclick = () => nav('screen-date');

        document.getElementById('btn-confirm-date').onclick = () => {
            if(!document.getElementById('birthdate').value) return alert("Nhập ngày sinh đã nè!");
            nav('screen-jar');
        };

        // LẮC BÌNH
        document.getElementById('jar-container').onclick = function() {
            if(this.classList.contains('shaking')) return;
            
            soundShake.play(); // Tiếng lạch cạch
            this.classList.add('shaking');

            setTimeout(() => {
                soundShake.stop();
                this.classList.remove('shaking');
                nav('screen-sticks');
                renderSticks();
            }, 2500);
        };

        function renderSticks() {
            const box = document.getElementById('sticks-box');
            box.innerHTML = '';
            for(let i=0; i<5; i++) {
                const s = document.createElement('div');
                s.className = 'stick';
                s.onclick = function() {
                    soundSwipe.play(); // Tiếng xoẹt
                    this.classList.add('selected');
                    setTimeout(showResult, 800);
                };
                box.appendChild(s);
            }
        }

        function showResult() {
            document.getElementById('fortune-msg').innerText = "Vận thế rạng rỡ, gặp dữ hóa lành, ghé 10/5 là hên!";
            document.getElementById('result-modal').style.display = 'flex';
        }

        // MARKETING GIẢM 10K CHO NHÓM 5 BẠN
        document.getElementById('btn-gift').onclick = function() {
            soundWin.play();
            const gifts = [
                "LỘC KẾT ĐOÀN: Nhóm 5 bạn mua chung -> GIẢM NGAY 10.000đ tổng đơn!",
                "LỘC TRI KỶ: Mua 3 ly tặng thêm Topping cho mỗi ly!",
                "LỘC MAY MẮN: Giảm ngay 2.000đ hóa đơn từ 2 ly!",
                "LỘC ĐẠI CÁT: Tặng 1 Sticker khi mua nước!"
            ];
            document.getElementById('gift-box').innerText = "🎁 " + gifts[Math.floor(Math.random()*gifts.length)];
            this.style.display = 'none';
            document.getElementById('timer-box').style.display = 'block';
            startTimer();
        };

        function startTimer() {
            let t = 900;
            const clock = document.getElementById('clock');
            const cd = setInterval(() => {
                let m = Math.floor(t / 60), s = t % 60;
                clock.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (t-- <= 0) clearInterval(cd);
            }, 1000);
        }
    </script>
</body>
</html>
